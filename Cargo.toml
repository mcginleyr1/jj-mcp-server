[package]
name = "jj-mcp-server"
version = "1.0.0"
edition = "2024"
description = "MCP server for Jujutsu (jj) version control system"
authors = ["Your Name <your.email@example.com>"]

[[bin]]
name = "jj-mcp-server"
path = "src/main.rs"

[dependencies]
rust-mcp-sdk = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
